mutation CreateUser($name: String!, $email: String!) @auth(level: USER) {
  user_insert(data: {id_expr: "auth.uid", name: $name, email: $email, role: "STUDENT"})
}

mutation UpdateUser($name: String, $profilePictureUrl: String) @auth(level: USER) {
  user_update(key: {id_expr: "auth.uid"}, data: {name: $name, profilePictureUrl: $profilePictureUrl})
}

mutation DeleteUser @auth(level: USER) {
  user_delete(key: {id_expr: "auth.uid"})
}

query GetCurrentUser @auth(level: USER) {
  user(key: {id_expr: "auth.uid"}) { name email role profilePictureUrl }
}

query ListAllUsers @auth(level: USER) {
  users { name email role }
}

mutation CreateCourse($title: String!, $description: String!) @auth(level: USER) {
  course_insert(data: {title: $title, description: $description, instructorId_expr: "auth.uid"})
}

mutation UpdateCourse($id: UUID!, $title: String) @auth(level: USER) {
  course_update(id: $id, data: {title: $title})
}

mutation DeleteCourse($id: UUID!) @auth(level: USER) {
  course_delete(id: $id)
}

query GetCourse($id: UUID!) @auth(level: PUBLIC, insecureReason: "Courses are public learning materials") {
  course(id: $id) { title description instructor { name } }
}

query ListCourses @auth(level: PUBLIC, insecureReason: "Publicly accessible course catalog") {
  courses { title description }
}

mutation CreateModule($courseId: UUID!, $title: String!, $contentUrl: String!, $orderIndex: Int!) @auth(level: USER) {
  module_insert(data: {course: {id: $courseId}, title: $title, contentUrl: $contentUrl, orderIndex: $orderIndex})
}

mutation UpdateModule($id: UUID!, $title: String) @auth(level: USER) {
  module_update(id: $id, data: {title: $title})
}

mutation DeleteModule($id: UUID!) @auth(level: USER) {
  module_delete(id: $id)
}

query GetModule($id: UUID!) @auth(level: PUBLIC, insecureReason: "Course content is public") {
  module(id: $id) { title contentUrl durationMinutes }
}

query ListModulesByCourse($courseId: UUID!) @auth(level: PUBLIC, insecureReason: "Public course structure") {
  modules(where: {courseId: {eq: $courseId}}) { title orderIndex }
}

mutation EnrollInCourse($courseId: UUID!) @auth(level: USER) {
  enrollment_insert(data: {course: {id: $courseId}, student: {id_expr: "auth.uid"}, enrollmentDate_date: {today: true}, status: "ACTIVE"})
}

mutation UpdateEnrollmentStatus($id: UUID!, $status: String) @auth(level: USER) {
  enrollment_update(id: $id, data: {status: $status})
}

mutation CancelEnrollment($id: UUID!) @auth(level: USER) {
  enrollment_delete(id: $id)
}

query GetMyEnrollment($id: UUID!) @auth(level: USER) {
  enrollment(id: $id) { course { title } enrollmentDate status }
}

query ListMyEnrollments @auth(level: USER) {
  enrollments(where: {studentId: {eq_expr: "auth.uid"}}) { course { title } enrollmentDate }
}

mutation CreateAssignment($moduleId: UUID!, $title: String!, $dueDate: Timestamp!) @auth(level: USER) {
  assignment_insert(data: {module: {id: $moduleId}, title: $title, dueDate: $dueDate})
}

mutation UpdateAssignment($id: UUID!, $maxPoints: Int) @auth(level: USER) {
  assignment_update(id: $id, data: {maxPoints: $maxPoints})
}

mutation DeleteAssignment($id: UUID!) @auth(level: USER) {
  assignment_delete(id: $id)
}

query GetAssignment($id: UUID!) @auth(level: PUBLIC, insecureReason: "Assignment details are public") {
  assignment(id: $id) { title dueDate maxPoints }
}

query ListAssignmentsByModule($moduleId: UUID!) @auth(level: PUBLIC, insecureReason: "Assignment lists are public") {
  assignments(where: {moduleId: {eq: $moduleId}}) { title dueDate }
}

mutation SubmitAssignment($assignmentId: UUID!, $url: String!) @auth(level: USER) {
  submission_insert(data: {assignment: {id: $assignmentId}, student: {id_expr: "auth.uid"}, submissionUrl: $url})
}

mutation UpdateGrade($id: UUID!, $grade: Int) @auth(level: USER) {
  submission_update(id: $id, data: {grade: $grade})
}

mutation DeleteSubmission($id: UUID!) @auth(level: USER) {
  submission_delete(id: $id)
}

query GetSubmission($id: UUID!) @auth(level: USER) {
  submission(id: $id) { submissionUrl grade instructorFeedback }
}

query ListMySubmissions @auth(level: USER) {
  submissions(where: {studentId: {eq_expr: "auth.uid"}}) { assignment { title } grade }
}